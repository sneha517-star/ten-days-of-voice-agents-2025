<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>☕ BeanBrew Voice Barista</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5ebe0;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h1 {
      margin-top: 30px;
      color: #5f4636;
    }
    #status {
      font-size: 18px;
      margin: 10px;
      color: #6c4a3d;
    }
    #orderBox {
      margin: 20px auto;
      width: 60%;
      background: white;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #c6ad87;
      text-align: left;
    }
    .btn {
      background: #6f4e37;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 18px;
    }
    .btn:hover {
      background: #503828;
    }
  </style>
</head>
<body>

<h1>☕ BeanBrew Voice Barista</h1>
<p id="status">Click the button and start speaking...</p>

<button class="btn" id="start">🎤 Start Order</button>

<div id="orderBox">
  <strong>Order Status:</strong>
  <pre id="order"></pre>
</div>

<script>
const order = {
  drinkType: null,
  size: null,
  milk: null,
  extras: [],
  name: null
};

const steps = [
  { key: "drinkType", question: "What drink would you like? (Latte, Cappuccino, Americano...)" },
  { key: "size", question: "What size? Small, Medium, Large?" },
  { key: "milk", question: "What milk would you like? Whole, Oat, Soy, Almond, or None?" },
  { key: "extras", question: "Any extras? Sugar, cinnamon, caramel? Say 'no extras' if none." },
  { key: "name", question: "Perfect! What name should I put on the order?" }
];

let stepIndex = 0;

function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  window.speechSynthesis.speak(speech);
}

function listen() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript.toLowerCase();
    document.getElementById("status").innerText = "Heard: " + text;
    processResponse(text);
  };

  recognition.onerror = () => speak("Sorry, I didn't catch that. Try again.");
}

function processResponse(text) {
  const step = steps[stepIndex];

  if (step.key === "extras") {
    if (text.includes("no")) order.extras = [];
    else order.extras = text.split(",").map(x => x.trim());
  } 
  else {
    order[step.key] = text.replace(".", "");
  }

  updateOrderDisplay();
  stepIndex++;

  if (stepIndex < steps.length) {
    speak(steps[stepIndex].question);
    setTimeout(listen, 1500);
  } else {
    finalizeOrder();
  }
}

function updateOrderDisplay() {
  document.getElementById("order").innerText = JSON.stringify(order, null, 2);
}

function finalizeOrder() {
  const summary = `Awesome! ${order.name}, your ${order.size} ${order.drinkType} with ${order.milk} milk and extras: ${order.extras.join(", ") || "none"} is being prepared! ☕`;

  speak(summary);
  downloadJSON(order);
}

function downloadJSON(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `order_${Date.now()}.json`;
  a.click();
}

document.getElementById("start").onclick = () => {
  speak("Welcome to BeanBrew! Let's start your order.");
  setTimeout(() => {
    speak(steps[0].question);
    listen();
  }, 1500);
};

</script>

</body>
</html>
