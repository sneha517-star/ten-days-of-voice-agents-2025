<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wellness Voice Companion</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6fb; margin: 0; padding: 40px; color: #1f2a44; }
    .card { max-width: 640px; margin: auto; padding: 32px; border-radius: 18px; background: #fff; box-shadow: 0 18px 40px rgba(31,42,68,0.12); }
    h1 { margin-top: 0; }
    #log { margin: 24px 0; height: 200px; overflow-y: auto; padding: 16px; border-radius: 12px; background: #f8f9fd; }
    .msg-user { color: #3c5a99; margin: 8px 0; }
    .msg-bot { color: #2a844e; margin: 8px 0; }
    button { border: none; border-radius: 999px; padding: 12px 24px; font-size: 16px; cursor: pointer; }
    .primary { background: linear-gradient(120deg,#4e9af1,#53c18f); color: #fff; }
    .secondary { background: #e0e5f2; color: #1f2a44; margin-left: 12px; }
    #status { font-size: 14px; color: #7481a6; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Health & Wellness Voice Companion</h1>
    <p>Tap “Listen” to speak, or “Stop” to pause recognition. The companion will talk back with mindfulness tips and gentle guidance.</p>

    <div id="log"></div>

    <button id="listen" class="primary">🎤 Listen</button>
    <button id="stop" class="secondary" disabled>✋ Stop</button>
    <div id="status">Idle</div>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;
    let selectedVoice = null;

    if (!SpeechRecognition || !synth) {
      alert('Web Speech API not supported in this browser. Try Chrome.');
    }

    const rec = new SpeechRecognition();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.continuous = false;

    const listenBtn = document.getElementById('listen');
    const stopBtn = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    const log = document.getElementById('log');

    function appendMessage(text, cls) {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function pickVoice() {
      if (!synth) return;
      const voices = synth.getVoices();
      selectedVoice =
        voices.find(v => /female/i.test(v.name)) ||
        voices.find(v => v.lang.startsWith('en')) ||
        voices[0] ||
        null;
    }

    if (synth) {
      pickVoice();
      synth.onvoiceschanged = pickVoice;
    }

    function speak(text) {
      if (!synth) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.pitch = 1.05;
      utter.rate = 1;
      if (selectedVoice) {
        utter.voice = selectedVoice;
      }
      synth.cancel(); // clear any queued speeches so replies stay in sync
      synth.speak(utter);
    }

    function wellnessReply(input) {
      const lower = input.toLowerCase();
      if (lower.includes('stress') || lower.includes('anxiety')) {
        return 'Try a slow inhale for 4 counts, pause, then exhale for 6. Repeat a few times and notice your shoulders soften.';
      }
      if (lower.includes('sleep')) {
        return 'Aim for a dim screen and gentle stretching before bed. Consistent sleep times help your body relax more easily.';
      }
      if (lower.includes('hydrate') || lower.includes('water')) {
        return 'Take a sip of water right now and set a reminder to keep a bottle nearby. Hydration fuels both focus and mood.';
      }
      if (lower.includes('motivation') || lower.includes('energ')) {
        return 'Break goals into tiny steps. Celebrate a 5 minute win, then build from there—you’ll regain momentum faster.';
      }
      if (lower.includes('diet') || lower.includes('nutrition') || lower.includes('food')) {
        return 'Aim to balance your plate with colorful veggies, lean protein, and a whole-grain base. Small swaps compound into long-term energy.';
      }
      if (lower.includes('exercise') || lower.includes('workout') || lower.includes('move')) {
        return 'Even five minutes of stretching or a brisk walk can reset your mood. Choose movements that feel kind to your joints today.';
      }
      if (lower.includes('sad') || lower.includes('down') || lower.includes('lonely')) {
        return 'I hear you. Try journaling a few sentences about what you feel, then reach out to someone you trust. You deserve support.';
      }
      if (lower.includes('gratitude') || lower.includes('thankful')) {
        return 'Pause and name three tiny things you appreciate right now. This gentle habit wires the brain toward calm and optimism.';
      }
      if (lower.includes('hi') || lower.includes('hello') || lower.includes('hey')) {
        return 'Hi there! I am here for gentle check-ins. Tell me how you are feeling or what you need support with today.';
      }
      const fallbackTips = [
        'Place a hand over your heart, notice the warmth, and breathe in for four counts. Your nervous system loves steady rhythms.',
        'Drink a full glass of water and roll your shoulders back three times. Quick posture resets open your breath.',
        'Pick one intention for the next hour—maybe focus, rest, or kindness—and let that guide your choices.',
        'Step outside for a minute, look at the furthest thing you can see, and soften your gaze. It relaxes eye strain and mind chatter.'
      ];
      return fallbackTips[Math.floor(Math.random() * fallbackTips.length)];
    }

    rec.onstart = () => {
      statusEl.textContent = 'Listening…';
      listenBtn.disabled = true;
      stopBtn.disabled = false;
    };

    rec.onend = () => {
      statusEl.textContent = 'Idle';
      listenBtn.disabled = false;
      stopBtn.disabled = true;
    };

    rec.onerror = e => {
      statusEl.textContent = `Error: ${e.error}`;
      listenBtn.disabled = false;
      stopBtn.disabled = true;
    };

    rec.onresult = e => {
      const transcript = e.results[0][0].transcript.trim();
      if (!transcript) {
        appendMessage('Companion: I did not catch that. Could you try again?', 'msg-bot');
        speak('I did not catch that. Could you try again?');
        return;
      }
      appendMessage(`You: ${transcript}`, 'msg-user');

      const reply = wellnessReply(transcript);
      appendMessage(`Companion: ${reply}`, 'msg-bot');
      speak(reply);
    };

    listenBtn.onclick = () => rec.start();
    stopBtn.onclick = () => rec.stop();
  </script>
</body>
</html>
