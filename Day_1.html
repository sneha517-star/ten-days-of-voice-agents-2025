<!DOCTYPE html>
<html>
<head>
  <title>Murf Voice Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      padding: 40px;
    }
    button {
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      margin: 15px;
    }
    #speakBtn { background: #4caf50; color: white; }
    #startBtn { background: #2196f3; color: white; }
    #status { margin-top: 20px; font-size: 20px; }
    textarea { width: 80%; height: 120px; margin-top: 20px; font-size: 18px; border-radius: 8px; padding: 10px; }
  </style>
</head>
<body>

  <h1>🎤 Murf Voice Agent</h1>
  <p>Speak and chat with your AI using Murf Falcon TTS</p>

  <button id="startBtn">🎤 Start Talking</button>
  <button id="speakBtn">🔊 Speak Response</button>

  <div id="status">Status: idle</div>
  <textarea id="output" placeholder="Recognized speech will appear here..."></textarea>

<script>
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "en-US";
  recognition.continuous = false;

  const output = document.getElementById("output");
  const statusText = document.getElementById("status");

  document.getElementById("startBtn").onclick = () => {
    recognition.start();
    statusText.innerText = "Listening...";
  };

  recognition.onresult = (event) => {
    const speech = event.results[0][0].transcript;
    output.value = speech;
    statusText.innerText = "Processing...";
  };

  document.getElementById("speakBtn").onclick = async () => {
    let text = output.value || "Say something first!";
    
    statusText.innerText = "Generating voice using Murf...";

    const response = await fetch("https://api.murf.ai/v1/speech/generate", {
      method: "POST",
      headers: {
        "api-key": "YOUR_MURF_API_KEY",  // <-- Replace with your actual key
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        voice: "falcon",
        text: text,
        format: "mp3"  // IMPORTANT FIX
      })
    });

    const arrayBuffer = await response.arrayBuffer();
    const audioBlob = new Blob([arrayBuffer], { type: "audio/mpeg" });
    const audioURL = URL.createObjectURL(audioBlob);

    const audio = new Audio(audioURL);
    await audio.play().catch(err => console.log("Playback error:", err));

    statusText.innerText = "Playing voice response...";
  };
</script>
</body>
</html>
